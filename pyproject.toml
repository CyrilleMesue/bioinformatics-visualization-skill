[project]
name = "bioinformatics-visualization-skill"
version = "0.1.0"
description = "Cursor skill and plotting library for publication-style bioinformatics figures."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "matplotlib>=3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
